<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk | bilas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="auth-card">
    <div class="brand">
      <div class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16l-1.3 10.2a2 2 0 0 1-2 1.8H7.3a2 2 0 0 1-2-1.8L4 8z"/><path d="M8 8V7a4 4 0 0 1 8 0v1"/><path d="M9.5 13.5c.7.8 1.5 1.2 2.5 1.2s1.8-.4 2.5-1.2"/></svg></div>
      <div><h2 class="brand-name">bilas</h2><div class="brand-sub">Manajemen Laundry</div></div>
    </div>
    <div class="eyebrow">Selamat datang</div>
    <h1 class="auth-title">Masuk ke akun kamu</h1>
    <p class="auth-desc">Masukkan username dan kata sandi untuk melanjutkan.</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Masukkan username" autocomplete="username" required>
        <div class="invalid-feedback">Username wajib diisi.</div>
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Kata Sandi</label>
        <input type="password" id="password" class="form-control" placeholder="Minimal 8 karakter" minlength="8" required>
        <div class="invalid-feedback">Kata sandi minimal 8 karakter.</div>
      </div>
      <div class="mb-4"></div>
      <button type="submit" class="btn-main">Masuk ke Dashboard <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <p class="switch-text" style="font-size:.8rem">Akun demo: username <b>petugas</b> atau <b>pemilik</b>, sandi bilas1234.</p>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
